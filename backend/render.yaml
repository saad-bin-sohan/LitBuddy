services:
  - type: web
    name: litbuddy-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://litbuddy.vercel.app
      - key: FRONTEND_URLS
        value: https://litbuddy.vercel.app
      - key: LOG_LEVEL
        value: info
      - key: LOG_HTTP_SLOW_MS
        value: "1500"
      - key: LOG_REDACTION_MODE
        value: balanced
      - key: LOG_STACKS
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
    healthCheckPath: /api/health
